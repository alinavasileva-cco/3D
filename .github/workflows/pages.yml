name: Publish Three.js room tour

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate model and prepare complete static site
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import struct, json, hashlib

          root = Path('.')
          output = Path('dist')
          output.mkdir(exist_ok=True)
          parts = [root / f'cabinet_room.part{i:02d}.bin' for i in range(1, 6)]
          for p in [*parts, root / 'index.html', root / 'cabinet_photo.png', root / 'forest_background.png']:
              if not p.is_file():
                  raise FileNotFoundError(str(p))
          data = b''.join(p.read_bytes() for p in parts)
          if len(data) != 10104552:
              raise ValueError(f'Incomplete GLB: {len(data)} bytes instead of 10104552')
          if data[:4] != b'glTF':
              raise ValueError('Wrong GLB header')
          version, declared_size = struct.unpack_from('<II', data, 4)
          if version != 2 or declared_size != len(data):
              raise ValueError(f'GLB size or version mismatch: v{version}, {declared_size}, {len(data)}')
          json_size, chunk_type = struct.unpack_from('<I4s', data, 12)
          if chunk_type != b'JSON':
              raise ValueError('GLB JSON chunk missing')
          model = json.loads(data[20:20 + json_size])
          if model.get('asset', {}).get('version') != '2.0':
              raise ValueError('Unexpected GLTF version')
          for p in [root / 'index.html', root / 'cabinet_photo.png', root / 'forest_background.png', *parts]:
              (output / p.name).write_bytes(p.read_bytes())
          (output / 'cabinet_room.glb').write_bytes(data)
          (output / '.nojekyll').write_text('')
          print('Validated GLB:', len(data), 'bytes; nodes:', len(model.get('nodes', [])),
                'meshes:', len(model.get('meshes', [])),
                'sha256:', hashlib.sha256(data).hexdigest())
          print('Ready website files:', [p.name for p in output.iterdir()])
          PY

      - name: Upload complete site as downloadable archive
        uses: actions/upload-artifact@v4
        with:
          name: cabinet-3d-tour-complete
          path: dist
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: error

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
