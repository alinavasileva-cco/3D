name: Validate 3D room tour (Free hosting)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-3d-site
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Assemble verified GLB and complete website
        run: python3 build_site.py

      - name: Archive complete HTML + GLB + textures
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cabinet-3d-tour-complete
          path: dist/
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: true

# Website is published free of charge by Cloudflare Pages Git integration.
# Cloudflare Pages: Build command "python3 build_site.py", output "dist", branch "main".
# GitHub Pages is intentionally not used: it is disabled for this private repo.
